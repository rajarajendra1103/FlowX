name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Test & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages (produces dist artifacts)
        run: npm run build

      - name: Run test suite
        run: npm run test

      - name: Publish to NPM
        run: npm publish --workspaces --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with auto-generated release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packages/core/dist/*
            packages/ui/dist/*
            packages/ui/planner/dist/*
            packages/charts/dist/*
            packages/devtools/dist/*
            packages/extensions/sse/dist/*
            packages/extensions/websockets/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
